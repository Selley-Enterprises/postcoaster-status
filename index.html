<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PostCoaster Status</title>
    <meta
      name="description"
      content="Live operational status for PostCoaster — the app, scheduled publishing, AI drafting, Autopilot, and campaigns."
    />
    <link rel="icon" href="./postcoaster-mark.svg" />
    <link rel="stylesheet" href="./status.css" />
  </head>
  <body>
    <div class="pcs-page">
      <header class="pcs-header">
        <a class="pcs-brand" href="https://www.postcoaster.com/" aria-label="PostCoaster home">
          <img src="./postcoaster-mark.svg" alt="" width="38" height="38" />
          <span><b>Post</b><strong>Coaster</strong></span>
        </a>
        <nav aria-label="Status page links">
          <a href="https://www.postcoaster.com/">Visit website</a>
          <a class="pcs-app-link" href="https://app.postcoaster.com/">Open app</a>
        </nav>
      </header>

      <main class="pcs-main">
        <div class="pcs-intro">
          <div>
            <p class="pcs-eyebrow">PostCoaster status</p>
            <h1>Service health at a glance</h1>
          </div>
          <p class="pcs-updated" id="pcs-updated"></p>
        </div>
        <div id="pcs-body"></div>
      </main>

      <footer class="pcs-footer">
        <span>PostCoaster keeps your social content moving.</span>
        <a href="mailto:support@postcoaster.com">support@postcoaster.com</a>
      </footer>
    </div>
    <script src="./render.js" defer></script>
  </body>
</html>
