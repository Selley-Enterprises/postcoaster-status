# Cloudflare Worker that polls PostCoaster and commits snapshot.json to the
# `data` branch via the GitHub Contents API. Writing to `data` (not `main`)
# keeps GitHub Pages from rebuilding on every probe, which is what was burning
# Actions minutes. See issue #3 and README "Polling via Cloudflare Worker".
name = "postcoaster-status-probe"
main = "worker/index.mjs"
compatibility_date = "2025-01-01"

# No public URL: the Worker only needs its Cron Trigger, and its HTTP handler is
# a write path (it commits snapshot.json). Disabling workers.dev keeps it off the
# open internet; the handler is additionally gated by PROBE_TRIGGER_SECRET.
workers_dev = false

# Workers Logs. This lives in the repo rather than only in the Cloudflare
# dashboard because wrangler.toml is the source of truth on a git-triggered
# deploy: any observability setting toggled in the dashboard is overwritten by
# this file on the next push. Logs let us confirm the cron actually fired and
# diagnose snapshot commit failures (GitHub API errors, bad/expired token).
[observability]
enabled = true

[observability.logs]
enabled = true
# Emit a log per invocation (request/response + metadata) so a silent cron is
# distinguishable from a cron that ran and failed.
invocation_logs = true

# Poll every ~5 minutes (free of GitHub Actions billing now that polling runs
# here rather than in Actions).
[triggers]
crons = ["*/5 * * * *"]

# Non-secret defaults. The GitHub token is NOT here — set it as a secret:
#   npx wrangler secret put GITHUB_TOKEN
# (a fine-grained PAT scoped to only this repo with Contents: Read and write).
# Optional second secret, only needed if you want the HTTP handler to be able to
# commit on demand:  npx wrangler secret put PROBE_TRIGGER_SECRET
[vars]
GITHUB_OWNER = "Selley-Enterprises"
GITHUB_REPO = "postcoaster-status"
# Snapshot store. Must NOT be the Pages source branch (`main`).
GITHUB_BRANCH = "data"
POSTCOASTER_APP_URL = "https://app.postcoaster.com"
